org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Build with a JDK 21 toolchain. Kotlin 2.1.0 bundles an IntelliJ JavaVersion parser
# that throws IllegalArgumentException on a "25.x" version string, so any JDK 25 fails
# the build outright.
#
# This deliberately does NOT point at Android Studio's bundled JBR any more: that path
# is whatever JDK the current Studio release ships, and a Studio update silently moved
# it from 21 to 25.0.2, breaking the CLI build with no local change. Pinning a real
# JDK 21 keeps the build reproducible.
org.gradle.java.home=/Users/rami/Library/Java/JavaVirtualMachines/temurin-21.0.8/Contents/Home
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
