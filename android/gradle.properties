org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Gradle daemon must run on JDK 21: Kotlin 2.1.0 bundles an IntelliJ JavaVersion
# parser that throws IllegalArgumentException on a "25.x" version string, so a JDK 25
# daemon fails the build with only "What went wrong: 25.0.2" to go on.
#
# The requirement is declared in gradle/gradle-daemon-jvm.properties, which Gradle
# satisfies from any locally installed JDK 21 it can detect. It is deliberately NOT an
# absolute org.gradle.java.home: that pinned one machine's path (and previously Android
# Studio's bundled JBR, which a Studio update silently moved from 21 to 25).
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
